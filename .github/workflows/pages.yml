name: Deploy Daily Grace

on:
  push:
    branches: [main]
  schedule:
    # 00:07 Philippine time (UTC+8). Scheduled runs can be delayed by GitHub.
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Broken references are silent at runtime, so catch them before publishing.
      # Remote misses only warn: a media-host blip must not block the daily deploy.
      - name: Check asset references
        run: node assets/scripts/check-assets.mjs --warn-remote
      - name: Generate today's social image metadata
        run: node assets/scripts/update-social-image.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html CNAME favicon.ico _site/
          cp -R assets apps _site/
          # Stamp every ?v=... in the shipped HTML with this commit. Pages
          # serves HTML for 10 minutes but scripts for 4 hours, so without
          # this a deploy can hand a visitor fresh HTML calling into a stale
          # cached script. Only the copy in _site is rewritten; the tokens in
          # the repo stay put and serve as the fallback for local viewing.
          VERSION="${GITHUB_SHA::7}"
          find _site -name '*.html' \
            -exec sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$VERSION/g" {} +
          echo "Stamped asset URLs with $VERSION"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
