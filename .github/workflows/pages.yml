name: Deploy Daily Grace

on:
  push:
    branches: [main]
  schedule:
    # 00:07 Philippine time (UTC+8). Scheduled runs can be delayed by GitHub.
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Broken references are silent at runtime, so catch them before publishing.
      # Remote misses only warn: a media-host blip must not block the daily deploy.
      - name: Check asset references
        run: node assets/scripts/check-assets.mjs --warn-remote
      - name: Generate today's social image metadata
        run: node assets/scripts/update-social-image.mjs
      # Reshuffle the story cards; seeded by the Manila date, so the order changes daily.
      - name: Shuffle today's story sequence
        run: node assets/scripts/update-stories-sequence.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html CNAME favicon.ico robots.txt sitemap.xml _site/
          cp -R assets apps _site/
          # Stamp every ?v=... in the shipped HTML with this commit. Pages
          # serves HTML for 10 minutes but scripts for 4 hours, so without
          # this a deploy can hand a visitor fresh HTML calling into a stale
          # cached script. Only the copy in _site is rewritten; the tokens in
          # the repo stay put and serve as the fallback for local viewing.
          VERSION="${GITHUB_SHA::7}"
          find _site -name '*.html' \
            -exec sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$VERSION/g" {} +
          echo "Stamped asset URLs with $VERSION"
      # The repo keeps JSON pretty for reading and diffs; the site gets it
      # compact. Only the copy in _site is rewritten. A file that does not
      # parse ships as it is, with a warning, so it cannot block the daily deploy.
      - name: Compact JSON in the published copy
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          let files = 0, before = 0, after = 0;
          for (const name of fs.readdirSync("_site", { recursive: true })) {
              if (!name.endsWith(".json")) {
                  continue;
              }
              const file = path.join("_site", name);
              const text = fs.readFileSync(file, "utf8");
              let compact;
              try {
                  compact = JSON.stringify(JSON.parse(text));
              } catch (error) {
                  console.log(`::warning file=${name}::not valid JSON, shipped as is: ${error.message}`);
                  continue;
              }
              fs.writeFileSync(file, compact);
              files += 1;
              before += Buffer.byteLength(text);
              after += Buffer.byteLength(compact);
          }
          const kb = (n) => `${Math.round(n / 1024)} KB`;
          console.log(`Compacted ${files} JSON files: ${kb(before)} -> ${kb(after)}`);
          EOF
      # The repo keeps JS and CSS readable; the site gets them minified. esbuild
      # runs file by file, without bundling, so every file and import stays as
      # it is. Only the copy in _site is rewritten. A file esbuild cannot read
      # ships as it is, with a warning; if esbuild cannot be installed, the
      # step fails on its own and the site ships unminified.
      - name: Minify JS and CSS in the published copy
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/minify" --no-save --no-audit --no-fund esbuild@0.24.0
          ESBUILD="$RUNNER_TEMP/minify/node_modules/esbuild" node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const { transformSync } = require(process.env.ESBUILD);
          const LOADERS = { ".js": "js", ".css": "css" };
          let files = 0, before = 0, after = 0;
          for (const name of fs.readdirSync("_site", { recursive: true })) {
              const loader = LOADERS[path.extname(name)];
              if (!loader) {
                  continue;
              }
              const file = path.join("_site", name);
              const text = fs.readFileSync(file, "utf8");
              let code;
              try {
                  code = transformSync(text, { loader, minify: true, legalComments: "none" }).code;
              } catch (error) {
                  console.log(`::warning file=${name}::not minified: ${error.message.split("\n")[0]}`);
                  continue;
              }
              fs.writeFileSync(file, code);
              files += 1;
              before += Buffer.byteLength(text);
              after += Buffer.byteLength(code);
          }
          const kb = (n) => `${Math.round(n / 1024)} KB`;
          console.log(`Minified ${files} JS and CSS files: ${kb(before)} -> ${kb(after)}`);
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
