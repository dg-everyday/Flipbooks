<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Daily Grace — Page not found</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#001b34" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <!-- GitHub Pages serves this for any address it doesn't have, so it
             must use addresses from the site's root. A shared day whose page
             wasn't written (assets/scripts/build-day-pages.mjs) still opens
             that day in the Daily Grace Archives, as its page would. -->
        <script>
            (function () {
                var match = /^\/d\/(\d{4}-\d{2}-\d{2})\.html$/.exec(location.pathname);
                if (match) {
                    location.replace("/apps/pages/library.html?from=link#day/" + match[1]);
                }
            })();
        </script>
        <style>
            html, body { height: 100%; margin: 0; }
            body { background: #001b34; overflow: hidden; }
            /* The whole page is the way home. A screen wider than the
               billboard shows all of it over a blurred copy of itself. */
            a {
                position: fixed;
                inset: 0;
                display: block;
                background: url("/assets/images/404.webp") center / cover no-repeat;
            }
            a::before {
                content: "";
                position: absolute;
                inset: 0;
                backdrop-filter: blur(24px) brightness(.7);
                -webkit-backdrop-filter: blur(24px) brightness(.7);
            }
            img {
                position: relative;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            @media (max-aspect-ratio: 1024 / 1920) {
                img { object-fit: cover; }
            }
        </style>
    </head>
    <body>
        <a href="https://dailygrace.faith">
            <img
                src="/assets/images/404.webp"
                alt="Daily Grace: page not found. Go to dailygrace.faith"
                width="1024"
                height="1920"
            />
        </a>
    </body>
</html>
