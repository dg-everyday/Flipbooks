<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"
        />

        <meta
            name="description"
            content="A year of grace, one page a day: every Daily Grace verse, reflection and poster, turned like the pages of a book."
        />
        <link
            rel="canonical"
            href="https://dailygrace.faith/apps/pages/flipbook.html"
        />

        <!-- Open Graph: how a link to this page looks when it is shared -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Daily Grace" />
        <meta property="og:locale" content="en_US" />
        <meta
            property="og:url"
            content="https://dailygrace.faith/apps/pages/flipbook.html"
        />
        <meta property="og:title" content="A year of grace • 365 days" />
        <meta
            property="og:description"
            content="A year of grace, one page a day: every Daily Grace verse, reflection and poster, turned like the pages of a book."
        />
        <!-- Today's banner: assets/scripts/update-social-image.mjs sets it on each deploy, so keep this one og:image tag. -->
        <meta
            property="og:image"
            content="https://dailygrace.faith/media/banner/2026/october/daily-grace-2026-10-18.webp"
        />
        <meta property="og:image:type" content="image/webp" />
        <meta property="og:image:width" content="1920" />
        <meta property="og:image:height" content="1024" />
        <meta
            property="og:image:alt"
            content="Today's Daily Grace banner, with the verse of the day"
        />
        <!-- X uses og:image for its large card. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#001b34" />

        <title>Daily Grace — Flipbook</title>
        <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
        <link
            rel="apple-touch-icon"
            href="../../assets/images/apple-touch-icon.png"
        />
        <link
            rel="stylesheet"
            href="../../assets/styles/flipbook-page.css?v=20261031-1"
        />
    </head>
    <body>
        <div class="app">
            <div class="topbar">
                <div class="brand">
                    <img
                        class="brand-logo"
                        src="../../assets/images/daily-grace-white-480.webp"
                        alt="Daily Grace"
                        width="480"
                        height="160"
                    />
                    <span class="brand-pill">Flipbook</span>
                </div>
                <div class="tools">
                    <!-- More weeks: the Daily Grace Archives, at this week's month. -->
                    <a
                        id="library"
                        href="library.html"
                        aria-label="More weeks in the Daily Grace Archives"
                        title="More weeks in the Daily Grace Archives"
                    >
                        <svg
                            width="28"
                            height="28"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect x="3" y="5" width="10" height="16" rx="1.5"></rect>
                            <path d="M15.5 6.3l3.6.9a1.5 1.5 0 0 1 1.1 1.8l-2.6 10.7"></path>
                            <path d="M8 9v5M5.6 11.2h4.8"></path>
                        </svg>
                    </a>
                    <button id="home" aria-label="Home" title="Home">
                        <svg
                            width="30"
                            height="30"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="m3 10 9-7 9 7"></path>
                            <path d="M5 9v12h14V9M9 21v-8h6v8"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <flip-book
                id="reader"
                aspect="9/16"
                label="Daily Grace flipbook"
                empty-text="No pages are available for this week yet."
            ></flip-book>
        </div>

        <script type="module">
            // Importing the component first guarantees the custom element is
            // upgraded before `pages` is assigned; setting it on a plain
            // HTMLElement would shadow the accessor and the list would never
            // reach the component.
            import "../../apps/components/flip-book.js?v=20261030-1";
            import { buildWeekPages } from "./scripts/daily-grace-week.js?v=20261009-1";

            // The main page links here with ?date=YYYY-MM-DD while the reader
            // is looking back at an earlier day, to open that day's week. The
            // builder falls back to this week for a missing, malformed or
            // future date.
            const date = new URLSearchParams(window.location.search).get(
                "date",
            );

            // The Library opens on the month of the week on show.
            const today = new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Manila",
            }).format(new Date());
            const shown =
                /^\d{4}-\d{2}-\d{2}$/.test(date ?? "") && date <= today
                    ? date
                    : today;
            document.getElementById("library").href =
                `library.html#month/${shown.slice(0, 7)}`;

            const reader = document.getElementById("reader");
            try {
                reader.pages = await buildWeekPages({ date });
            } catch (error) {
                console.error("Unable to build this week's pages:", error);
                reader.pages = [];
            }
        </script>
        <script>
            document.getElementById("home").addEventListener("click", () => {
                // Stepping back lets the browser hand the main page over just
                // as the reader left it, scroll position and all. A fresh load
                // is the fallback for a Flipbook opened straight from a link;
                // the main page then restores the position it saved itself.
                let cameFromMain = false;
                try {
                    const from = new URL(document.referrer);
                    cameFromMain =
                        from.origin === window.location.origin &&
                        /(^|\/)(index\.html)?$/.test(from.pathname);
                } catch {}
                if (cameFromMain && window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = "../../index.html";
                }
            });
        </script>
    </body>
</html>
