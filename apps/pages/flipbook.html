<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"
        />

        <!-- Primary Open Graph Meta Tags -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://dailygrace.faith" />
        <meta property="og:title" content="A year of grace • 365 days" />
        <meta
            property="og:description"
            content="A simple place to pause, reflect, and draw closer to God each day. Each day brings a Bible verse, a short reflection, and an encouraging message to remind us that God's grace is sufficient for today and that there is always hope for tomorrow."
        />

        <!-- Image Meta Tags -->
        <meta
            property="og:image"
            content="https://dailygrace.faith/media/banner/september/daily-grace-2026-09-23.webp"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <title>Daily Grace — Flipbook</title>
        <link
            rel="stylesheet"
            href="../../assets/styles/flipbook-page.css?v=20260923-3"
        />
    </head>
    <body>
        <div class="app">
            <div class="topbar">
                <div class="brand">
                    <img
                        class="brand-logo"
                        src="../../assets/images/daily-grace-white.webp"
                        alt="Daily Grace"
                        width="2172"
                        height="724"
                    />
                    <span class="brand-pill">Flipbook</span>
                </div>
                <div class="tools">
                    <button id="home" aria-label="Home" title="Home">
                        <svg
                            width="30"
                            height="30"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="m3 10 9-7 9 7"></path>
                            <path d="M5 9v12h14V9M9 21v-8h6v8"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <flip-book
                id="reader"
                aspect="9/16"
                label="Daily Grace flipbook"
                empty-text="No pages are available for this week yet."
            ></flip-book>
        </div>

        <script type="module">
            // Importing the component first guarantees the custom element is
            // upgraded before `pages` is assigned; setting it on a plain
            // HTMLElement would shadow the accessor and the list would never
            // reach the component.
            import "../../apps/components/flip-book.js?v=20260923-3";
            import { buildWeekPages } from "./scripts/daily-grace-week.js?v=20260924-1";

            // The main page links here with ?date=YYYY-MM-DD while the reader
            // is looking back at an earlier day, to open that day's week. A
            // missing, malformed or future date falls back to this week.
            function requestedDate() {
                const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(
                    new URLSearchParams(window.location.search).get("date") || "",
                );
                if (!match) return undefined;
                const [, year, month, day] = match.map(Number);
                const date = new Date(year, month - 1, day);
                if (date.getMonth() !== month - 1 || date > new Date()) return undefined;
                return date;
            }

            const reader = document.getElementById("reader");
            try {
                reader.pages = await buildWeekPages({ date: requestedDate() });
            } catch (error) {
                console.error("Unable to build this week's pages:", error);
                reader.pages = [];
            }
        </script>
        <script>
            document.getElementById("home").addEventListener("click", () => {
                // Stepping back lets the browser hand the main page over just
                // as the reader left it, scroll position and all. A fresh load
                // is the fallback for a Flipbook opened straight from a link;
                // the main page then restores the position it saved itself.
                let cameFromMain = false;
                try {
                    const from = new URL(document.referrer);
                    cameFromMain =
                        from.origin === window.location.origin &&
                        /(^|\/)(index\.html)?$/.test(from.pathname);
                } catch {}
                if (cameFromMain && window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = "../../index.html";
                }
            });
        </script>
    </body>
</html>
