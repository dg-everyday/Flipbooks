    <body>
        <div class="topbar">
            <a
                class="brand"
                href="living-voice.html"
                aria-label="The Living Voice"
            >
                <img
                    class="brand-logo"
                    src="../../assets/images/daily-grace-white-480.webp"
                    alt="Daily Grace"
                    width="480"
                    height="160"
                />
                <span class="brand-pill">The Living Voice</span>
            </a>
            <a
                class="home"
                href="../../index.html"
                aria-label="Home"
                title="Home"
            >
                <svg
                    width="30"
                    height="30"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="m3 10 9-7 9 7"></path>
                    <path d="M5 9v12h14V9M9 21v-8h6v8"></path>
                </svg>
            </a>
        </div>

        <!-- living-voice.js renders the player and the chapter beside it into
             this element; #<episode id> (#mark-01) opens that chapter. -->
        <main id="view">
            <p class="status">Loading The Living Voice…</p>
        </main>

        <!-- While an episode plays and the player is scrolled out of view: its
             title and a play/pause button, back to the player with a tap. -->
        <div class="mini-player" id="mini-player" hidden></div>

        <footer class="page-footer">
            Scripture quotations from the King James Version. Narrated with a
            computer voice; the words are written and checked by Daily Grace.
        </footer>

        <script type="module">
            import { start } from "./scripts/living-voice.js?v=20261112-1";
            start(
                document.getElementById("view"),
                document.getElementById("mini-player"),
            );
        </script>
    </body>
