        <meta name="twitter:card" content="summary_large_image" />

        <title>Daily Grace — Bible Walk</title>
        <link rel="icon" type="image/x-icon" href="../../favicon.ico" />

            href="../../assets/images/apple-touch-icon.png"

            type="font/woff2"

        <link

        />
        <link
            rel="stylesheet"
            href="../../assets/styles/study-page.css?v=20261016-6"
        />
        <link

            href="../../assets/styles/bible-walk-page.css?v=20261107-1"
        />
    </head>
    <body>
        <div class="topbar">
            <a class="brand" href="bible-walk.html" aria-label="Bible Walk">
                <img
                    class="brand-logo"
                    src="../../assets/images/daily-grace-white-480.webp"
                    alt="Daily Grace"
                    width="480"
                    height="160"
                />
                <span class="brand-pill">Bible Walk</span>
            </a>
            <a
                class="home"
                href="../../index.html"
                aria-label="Home"
                title="Home"
            >
                <svg
                    width="30"
                    height="30"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="m3 10 9-7 9 7"></path>
                    <path d="M5 9v12h14V9M9 21v-8h6v8"></path>
                </svg>
            </a>
        </div>

        <!-- bible-walk.js renders the plans into this element; #<episode id>
             (#mark-01) opens that episode with its player. -->
        <main id="view">
            <p class="status">Loading Bible Walk…</p>
        </main>

        <!-- While an episode plays and another view is open: its title and
             a play/pause button, back to the episode with a tap. -->
        <div class="mini-player" id="mini-player" hidden></div>

        <footer class="page-footer">
            Scripture quotations from the King James Version. Narrated with a
            computer voice; the words are written and checked by Daily Grace.
        </footer>

        <script type="module">
            import { start } from "./scripts/bible-walk.js?v=20261107-1";
            start(
                document.getElementById("view"),
                document.getElementById("mini-player"),
            );
        </script>
    </body>
