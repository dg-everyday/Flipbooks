<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"
        />
        <meta
            name="description"
            content="Stories from Scripture, retold to read, listen to and share: each one with its pictures, an audio reading and a storybook to download."
        />
        <link
            rel="canonical"
            href="https://dailygrace.faith/apps/pages/stories.html"
        />

        <!-- Open Graph: how a link to this page looks when it is shared -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Daily Grace" />
        <meta property="og:locale" content="en_US" />
        <meta
            property="og:url"
            content="https://dailygrace.faith/apps/pages/stories.html"
        />
        <meta property="og:title" content="Bible Stories — Daily Grace" />
        <meta
            property="og:description"
            content="Stories from Scripture, retold to read, listen to and share: each one with its pictures, an audio reading and a storybook to download."
        />
        <meta
            property="og:image"
            content="https://dailygrace.faith/assets/images/share/stories.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Bible Stories from Daily Grace"
        />
        <!-- X uses og:image for its large card. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#001b34" />

        <title>Daily Grace — Stories</title>
        <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
        <link
            rel="apple-touch-icon"
            href="../../assets/images/apple-touch-icon.png"
        />
        <link
            rel="stylesheet"
            href="../../assets/styles/flipbook-page.css?v=20261025-2"
        />
    </head>
    <body>
        <div class="app">
            <div class="topbar">
                <div class="brand">
                    <img
                        class="brand-logo"
                        src="../../assets/images/daily-grace-white-480.webp"
                        alt="Daily Grace"
                        width="480"
                        height="160"
                    />
                    <span class="brand-pill" id="storyName">Stories</span>
                </div>
                <div class="tools">
                    <button id="home" aria-label="Home" title="Home">
                        <svg
                            width="30"
                            height="30"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="m3 10 9-7 9 7"></path>
                            <path d="M5 9v12h14V9M9 21v-8h6v8"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <script>
                // A Daily Grace Kids story (?set=kids) wears the kids logo, with
                // no title pill (its comic cover already carries the title), and
                // its home button goes back to the Daily Grace Kids page it was
                // opened from. Done here, before the page is first drawn, so the
                // Daily Grace logo never shows for a moment first.
                if (new URLSearchParams(location.search).get("set") === "kids") {
                    document.getElementById("storyName").hidden = true;
                    const logo = document.querySelector(".brand-logo");
                    logo.src = "../../assets/images/kids/daily-grace-kids-logo.webp";
                    logo.alt = "Daily Grace Kids";
                    logo.width = 720;
                    logo.height = 145;
                    logo.classList.add("brand-logo-kids");
                    const home = document.getElementById("home");
                    home.dataset.href = "daily-grace-kids.html";
                    home.setAttribute("aria-label", "Back to Daily Grace Kids");
                    home.title = "Back to Daily Grace Kids";
                }
            </script>

            <flip-book
                id="reader"
                aspect="9/16"
                label="Daily Grace story"
            ></flip-book>
        </div>
        <!-- Shows a sticker earned for reading to the last page. -->
        <sticker-gifts album-href="stickers.html"></sticker-gifts>

        <script type="module">
            // Same component as the flipbook, different content entirely. Which
            // story to show comes from the query string: ?story=daniel3 reads
            // assets/stories/daniel3.json, and ?set=kids&story=daniel3 reads the
            // children's retelling, assets/kids/stories/daniel3.json.
            import "../../apps/components/flip-book.js?v=20261025-1";
            import {
                storySlug,
                storySet,
                loadStory,
                toFlipPages,
            } from "./scripts/stories.js?v=20261024-1";
            import { kjvNotes, withKjvPills } from "./scripts/story-kjv.js?v=20261025-2";
            import { recordStory } from "../../assets/scripts/sticker-progress.js?v=20261018-1";
            // A sticker earned here is shown as a gift on this page.
            import "../../apps/components/sticker-gifts.js?v=20261023-1";

            const reader = document.getElementById("reader");
            const storyName = document.getElementById("storyName");

            // empty-text is read when the list is applied, so it is set first.
            function showNothing(message) {
                reader.setAttribute("empty-text", message);
                reader.pages = [];
            }

            const { slug, reason } = storySlug();
            const set = storySet();

            if (reason === "missing") {
                showNothing("No story chosen. Try stories.html?story=daniel3");
            } else if (reason === "invalid") {
                showNothing("That story name is not a valid one.");
            } else {
                try {
                    const story = await loadStory(slug, set);

                    if (story.title) {
                        document.title = `Daily Grace — ${story.title}`;
                        storyName.textContent = story.title;
                        reader.setAttribute("label", story.title);
                    }
                    if (story.aspect) {
                        reader.setAttribute("aspect", story.aspect);
                    }

                    if (story.pages.length === 0) {
                        showNothing("That story has no pages yet.");
                    } else {
                        // Reading to the last page counts toward the stickers.
                        reader.addEventListener("finish", () => recordStory(slug));
                        // Pages whose pictures put God's, Jesus' or an angel's
                        // words simply wear a KJV pill with the exact verses.
                        kjvNotes(reader, story);
                        reader.pages = withKjvPills(toFlipPages(story), story);
                    }
                } catch (error) {
                    console.error(`Unable to load story "${slug}":`, error);
                    showNothing(`Could not find a story called “${slug}”.`);
                }
            }
        </script>
        <script>
            const home = document.getElementById("home");
            home.addEventListener("click", () => {
                window.location.href = home.dataset.href || "../../index.html";
            });
        </script>
    </body>
</html>
