<title id="title">Colossians — The Supreme Crown</title>
<desc id="description">Christ reigns supreme over all creation, fully sufficient to sustain faith and complete spiritual life.</desc>
<metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
