<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Genesis — Tree of Life and Globe — בראשית</title>
  <desc id="description">God creates the world, establishes humanity, and begins His covenant relationship with His people.</desc>
  <metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
  <defs>
    <clipPath id="globe-clip"><circle cx="512" cy="700" r="260"/></clipPath>
    <path id="leaf" d="M0 0C-33-27-38-78 0-120C38-78 33-27 0 0Z"/>
    <g id="left-branches" stroke="#B98232" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="28" d="M511 480C462 433 427 389 377 353C324 315 269 298 220 257M501 389C454 340 431 293 420 251M450 423C368 410 292 385 229 355C196 340 168 317 147 292"/>
      <path stroke-width="18" d="M375 353C340 319 334 287 336 258M322 393C286 391 250 404 220 414M285 294C273 267 271 238 273 217M414 383C405 357 404 333 408 310"/>
    </g>
    <g id="left-leaves">
      <g fill="#168666">
        <use href="#leaf" transform="translate(454 289) rotate(-23) scale(1.15)"/>
        <use href="#leaf" transform="translate(396 325) rotate(-42) scale(1.22)"/>
        <use href="#leaf" transform="translate(309 313) rotate(-54) scale(1.22)"/>
        <use href="#leaf" transform="translate(250 279) rotate(-47) scale(1.16)"/>
        <use href="#leaf" transform="translate(230 362) rotate(-72) scale(1.19)"/>
        <use href="#leaf" transform="translate(336 408) rotate(-79) scale(1.04)"/>
      </g>
      <g fill="#45AC70">
        <use href="#leaf" transform="translate(415 241) rotate(-24) scale(.97)"/>
        <use href="#leaf" transform="translate(344 251) rotate(-36) scale(1.05)"/>
        <use href="#leaf" transform="translate(186 307) rotate(-61) scale(.99)"/>
        <use href="#leaf" transform="translate(225 413) rotate(-105) scale(.96)"/>
        <use href="#leaf" transform="translate(405 435) rotate(-100) scale(.83)"/>
      </g>
      <g fill="#90C760">
        <use href="#leaf" transform="translate(469 205) rotate(-22) scale(.77)"/>
        <use href="#leaf" transform="translate(274 229) rotate(-44) scale(.8)"/>
      </g>
    </g>
    <g id="left-rays" stroke="#EAB84F" stroke-width="12" stroke-linecap="round">
      <path d="M70 334H99M110 220L135 235M213 120L232 144M348 77L359 103"/>
    </g>
    <g id="left-roots" stroke="#DCA449" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="22" d="M512 497C485 522 462 538 433 548C412 555 397 565 386 578"/>
      <path stroke-width="14" d="M465 532C459 560 446 580 429 592M416 555L397 551"/>
    </g>
  </defs>

  <!-- A circular globe with mirrored meridians and latitude lines. -->
  <g id="world">
    <circle cx="512" cy="700" r="260" fill="#187DA7"/>
    <g clip-path="url(#globe-clip)" stroke="#5BBDAC" stroke-width="13">
      <ellipse cx="512" cy="700" rx="126" ry="260"/>
      <path d="M512 440V960M252 700H772M269 606C399 658 625 658 755 606M269 794C399 742 625 742 755 794"/>
    </g>
  </g>

  <!-- The two halves use the same geometry, reflected about the center. -->
  <g id="creation-light">
    <use href="#left-rays"/>
    <use href="#left-rays" transform="translate(1024 0) scale(-1 1)"/>
    <path fill="#EAB84F" d="M512 64C518 89 525 96 550 102C525 108 518 115 512 140C506 115 499 108 474 102C499 96 506 89 512 64Z"/>
  </g>
  <g id="tree">
    <path fill="#B98232" d="M512 225C493 278 490 328 493 383C497 438 489 474 467 506C482 503 496 506 512 514C528 506 542 503 557 506C535 474 527 438 531 383C534 328 531 278 512 225Z"/>
    <use href="#left-branches"/>
    <use href="#left-branches" transform="translate(1024 0) scale(-1 1)"/>
    <use href="#left-leaves"/>
    <use href="#left-leaves" transform="translate(1024 0) scale(-1 1)"/>
    <use href="#leaf" fill="#168666" transform="translate(512 289) scale(1.08)"/>
  </g>
  <g id="roots">
    <use href="#left-roots"/>
    <use href="#left-roots" transform="translate(1024 0) scale(-1 1)"/>
    <path d="M512 503V594" stroke="#DCA449" stroke-width="23" stroke-linecap="round"/>
  </g>
</svg>
