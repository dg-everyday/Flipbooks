<title id="title">Micah — Sword Beaten to Plowshare — מיכה</title>
<desc id="description">Weapons transformed into farming tools portray God's promised peace, replacing violence with cultivation and flourishing.</desc>
<metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
