<title id="title">Nahum — Broken Yoke</title>
<desc id="description">God breaks oppressive power, bringing liberation to the afflicted and decisive judgment upon Nineveh.</desc>
<metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
