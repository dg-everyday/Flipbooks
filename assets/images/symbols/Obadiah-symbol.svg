<title id="title">Obadiah — Eagle on a Crag</title>
<desc id="description">Pride in seemingly impregnable strength leads toward downfall, revealing the futility of arrogance before God.</desc>
<metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
