<title id="title">Zephaniah — Searching Lantern</title>
<desc id="description">God searches hidden darkness, exposing wrongdoing and announcing judgment that calls His people to repentance.</desc>
<metadata>Daily Grace. Grace for Today. Our Faith Tomorrow.</metadata>
