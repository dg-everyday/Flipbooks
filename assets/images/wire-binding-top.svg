<svg xmlns="http://www.w3.org/2000/svg" width="28" height="24" viewBox="0 0 28 24">
  <defs>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5f7f8"/>
      <stop offset=".35" stop-color="#aeb8c1"/>
      <stop offset=".75" stop-color="#52606d"/>
      <stop offset="1" stop-color="#d9dfe4"/>
    </linearGradient>
  </defs>
  <!-- The hole, just inside the paper below the top edge (y = 14). -->
  <ellipse cx="14" cy="17.5" rx="4.2" ry="2.4" fill="#2b241a" stroke="#fff5df" stroke-width="1"/>
  <!-- A short, straight ring: it rises above the edge and dips into the hole. -->
  <rect x="11.6" y="4" width="4.8" height="14" rx="2.4" fill="#211a12" fill-opacity=".28" transform="translate(1.2 1.2)"/>
  <rect x="11.6" y="4" width="4.8" height="14" rx="2.4" fill="#35404a"/>
  <rect x="12.4" y="4.6" width="3.2" height="12.6" rx="1.6" fill="url(#rod)"/>
</svg>
