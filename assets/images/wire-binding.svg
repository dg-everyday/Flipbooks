<svg xmlns="http://www.w3.org/2000/svg" width="40" height="28" viewBox="0 0 40 28">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5f7f8"/>
      <stop offset=".3" stop-color="#aeb8c1"/>
      <stop offset=".65" stop-color="#52606d"/>
      <stop offset="1" stop-color="#d9dfe4"/>
    </linearGradient>
    <radialGradient id="hole">
      <stop offset=".35" stop-color="#171410"/>
      <stop offset=".8" stop-color="#42382b"/>
      <stop offset="1" stop-color="#89775c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b6a485"/>
      <stop offset="1" stop-color="#fff5df"/>
    </linearGradient>
  </defs>
  <!-- Holes sit fully inside the paper, beyond the 16px center gap. -->
  <g fill="url(#hole)" stroke="url(#rim)" stroke-width="1.2">
    <ellipse cx="6" cy="17" rx="4" ry="4.5"/>
    <ellipse cx="34" cy="17" rx="4" ry="4.5"/>
  </g>
  <!-- Only the exposed arch is visible; the return passes under the paper. -->
  <path d="M6 18C3 2 37 2 34 18" fill="none" stroke="#211a12" stroke-opacity=".28" stroke-width="4" transform="translate(0 2)"/>
  <path d="M6 18C3 2 37 2 34 18" fill="none" stroke="#35404a" stroke-width="3.6"/>
  <path d="M6 18C3 2 37 2 34 18" fill="none" stroke="url(#wire)" stroke-width="2.3"/>
  <!-- The near walls occlude the wire tips, giving the holes depth. -->
  <g fill="#42382b">
    <path d="M2.5 18.5Q6 21 9.5 18.5Q9 21.5 6 21.5Q3 21.5 2.5 18.5Z"/>
    <path d="M30.5 18.5Q34 21 37.5 18.5Q37 21.5 34 21.5Q31 21.5 30.5 18.5Z"/>
  </g>
  <path d="M2.5 19Q6 24 9.5 19M30.5 19Q34 24 37.5 19" fill="none" stroke="#f5e8cf" stroke-width="1"/>
</svg>
