<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>Daily Grace — Flipbook (Viewport Fit)</title>
<style>
:root {
  --navy:#071d35;
  --gold:#d9a84f;
  --cream:#f7f0df;
  --shadow:rgba(0,0,0,.38);
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#081727; }
body {
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  touch-action:none;
}
.app {
  width:100%; height:100%; display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 50% 30%, rgba(217,168,79,.09), transparent 35%),
    linear-gradient(135deg,#071727,#102b46 50%,#061522);
}
.topbar {
  height:58px; flex:0 0 58px; display:flex; align-items:center;
  justify-content:space-between; padding:0 14px;
  border-bottom:1px solid rgba(217,168,79,.35);
  background:rgba(4,17,31,.88); backdrop-filter:blur(10px);
  z-index:20;
}
.brand { font-weight:700; letter-spacing:.04em; }
.brand span { color:var(--gold); }
.tools { display:flex; gap:7px; align-items:center; }
button {
  appearance:none; border:1px solid rgba(217,168,79,.55);
  background:#102b46; color:#fff; border-radius:9px;
  min-width:38px; height:36px; padding:0 11px;
  font-size:15px; font-weight:650; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
button:hover { background:#173956; }
button:disabled { opacity:.38; cursor:default; }
#zoomLabel { min-width:55px; text-align:center; font-variant-numeric:tabular-nums; }
.stage {
  flex:1; min-height:0; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  perspective:2200px; perspective-origin:50% 50%;
  cursor:grab;
}
.stage.dragging { cursor:grabbing; }
.book-shadow {
  position:absolute; width:min(92vw,560px); height:min(78vh,1000px);
  border-radius:12px; background:rgba(0,0,0,.32); filter:blur(24px);
  transform:translateY(20px) scale(.96); pointer-events:none;
}
.book {
  position:relative;
  /* Fit the entire page inside the available viewport area. */
  width:auto;
  height:min(calc(100vh - 123px), 92vh);
  aspect-ratio:9 / 16;
  max-width:calc(100vw - 24px);
  max-height:calc(100vh - 123px);
  transform-style:preserve-3d;
  transition:transform .18s ease;
  will-change:transform;
}
.page {
  position:absolute; inset:0; transform-style:preserve-3d;
  transform-origin:left center;
  border-radius:5px 9px 9px 5px;
  overflow:hidden;
  box-shadow:8px 10px 25px var(--shadow);
  background:#eee;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.page img {
  width:100%; height:100%; object-fit:contain; display:block;
  background:#eee;
  user-select:none; -webkit-user-drag:none;
}
.page.back {
  transform:rotateY(180deg);
}
.flip {
  transition:transform .72s cubic-bezier(.22,.7,.18,1);
}
.flipped {
  transform:rotateY(-180deg);
}
/* Pages are layered from right to left. */
.page:nth-child(1) { z-index:4; }
.page:nth-child(2) { z-index:3; }
.page:nth-child(3) { z-index:2; }
.page:nth-child(4) { z-index:1; }

.bottom {
  height:65px; flex:0 0 65px; display:flex; align-items:center;
  justify-content:center; gap:13px; padding:8px 12px;
  border-top:1px solid rgba(217,168,79,.3);
  background:rgba(4,17,31,.9); backdrop-filter:blur(10px);
  z-index:20;
}
.nav {
  width:115px; height:42px; border-radius:11px;
  font-size:14px;
}
.counter { min-width:72px; text-align:center; color:#ddd; font-size:14px; }
.hint {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.58); font-size:12px; pointer-events:none;
  white-space:nowrap;
}
.loading {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:#081727; z-index:50; font-size:16px;
}
@media (max-width:600px) {
  .topbar { height:52px; flex-basis:52px; padding:0 9px; }
  .brand { font-size:14px; }
  button { min-width:35px; height:34px; padding:0 8px; }
  .stage { padding:3px; }
  .book {
    width:auto;
    height:min(calc(100vh - 115px), 92vh);
    aspect-ratio:9 / 16;
    max-width:calc(100vw - 8px);
    max-height:calc(100vh - 115px);
  }
  .bottom { display:none; }
  .hint { display:none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Daily <span>Grace</span> · Flipbook</div>
    <div class="tools">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <div id="zoomLabel">100%</div>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="fit" aria-label="Fit page">Fit</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="loading" id="loading">Preparing your Daily Grace flipbook…</div>
    <div class="book-shadow"></div>
    <div class="book" id="book" aria-label="Daily Grace flipbook"></div>
    <div class="hint">Swipe left/right or use Previous / Next · Pinch or wheel to zoom</div>
  </main>

  <div class="bottom">
    <button class="nav" id="prev">‹ Previous</button>
    <div class="counter" id="counter">1 / 4</div>
    <button class="nav" id="next">Next ›</button>
  </div>
</div>

<script>
let images = [];
const book = document.getElementById('book');
const stage = document.getElementById('stage');
const loading = document.getElementById('loading');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const zoomLabel = document.getElementById('zoomLabel');

let current = 0;       // number of pages turned
let zoom = 1;
let panX = 0, panY = 0;
let pointerStart = null;
let pinchStart = null;
let animating = false;


function fitBookToViewport() {
  const stageRect = stage.getBoundingClientRect();
  const availableW = Math.max(1, stageRect.width - 16);
  const availableH = Math.max(1, stageRect.height - 16);

  // Daily Grace artwork is portrait. Use the actual first image ratio when loaded.
  const firstImg = book.querySelector('img');
  const ratio = firstImg && firstImg.naturalWidth && firstImg.naturalHeight
    ? firstImg.naturalWidth / firstImg.naturalHeight
    : 9 / 16;

  let h = availableH;
  let w = h * ratio;

  if (w > availableW) {
    w = availableW;
    h = w / ratio;
  }

  book.style.width = `${Math.floor(w)}px`;
  book.style.height = `${Math.floor(h)}px`;

  // Keep zoom/pan independent of the fit calculation.
  if (zoom === 1) {
    panX = 0;
    panY = 0;
    updateZoom();
  }
}

function buildPages() {
  images.forEach((src, i) => {
    const page = document.createElement('div');
    page.className = 'page flip';
    page.dataset.index = i;
    page.style.zIndex = String(images.length - i);

    const img = document.createElement('img');
    img.src = src;
    img.alt = `Daily Grace page ${i + 1}`;
    img.draggable = false;
    page.appendChild(img);
    book.appendChild(page);
  });
}

function render() {
  [...book.children].forEach((page, i) => {
    page.classList.toggle('flipped', i < current);
    // Turned pages sit above unturned pages.
    page.style.zIndex = i < current ? (20 + i) : (images.length - i);
  });
  counter.textContent = `${current + 1 > images.length ? images.length : current + 1} / ${images.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === images.length - 1;
  updateZoom();
}

function goNext() {
  if (animating || current >= images.length - 1) return;
  animating = true;
  current++;
  render();
  setTimeout(() => animating = false, 740);
}
function goPrev() {
  if (animating || current <= 0) return;
  animating = true;
  current--;
  render();
  setTimeout(() => animating = false, 740);
}

function updateZoom() {
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
  book.style.transformOrigin = 'center center';
  book.style.transform = `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;
}

function setZoom(z, centerX=null, centerY=null) {
  const old = zoom;
  zoom = Math.max(1, Math.min(3.5, z));
  if (centerX !== null && centerY !== null && zoom !== old) {
    // Keep the point under the user's fingers/mouse roughly stationary.
    const r = zoom / old;
    panX = centerX - (centerX - panX) * r;
    panY = centerY - (centerY - panY) * r;
  }
  if (zoom === 1) { panX = 0; panY = 0; }
  updateZoom();
}

function resetFit() {
  zoom = 1;
  panX = 0;
  panY = 0;
  fitBookToViewport();
  updateZoom();
}

prevBtn.onclick = goPrev;
nextBtn.onclick = goNext;
document.getElementById('zoomIn').onclick = () => setZoom(zoom + .25);
document.getElementById('zoomOut').onclick = () => setZoom(zoom - .25);
document.getElementById('fit').onclick = resetFit;

// Mouse wheel zoom (trackpads and desktop mice).
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width/2;
  const y = e.clientY - rect.top - rect.height/2;
  setZoom(zoom * Math.exp(-e.deltaY * .001), x, y);
}, {passive:false});

// Pointer gestures: swipe to turn pages; drag when zoomed.
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pointerStart = {x:e.clientX, y:e.clientY, t:performance.now()};
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!pointerStart) return;
  if (zoom > 1 && e.pointerType === 'mouse') {
    panX += e.movementX;
    panY += e.movementY;
    updateZoom();
  }
});
stage.addEventListener('pointerup', e => {
  stage.classList.remove('dragging');
  if (!pointerStart) return;
  const dx = e.clientX - pointerStart.x;
  const dy = e.clientY - pointerStart.y;
  const dt = performance.now() - pointerStart.t;
  pointerStart = null;

  if (zoom > 1) return;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25 && dt < 700) {
    // RTL flipbook behavior: swipe left = next page, swipe right = previous.
    if (dx < 0) goNext(); else goPrev();
  }
});

// Native pinch-to-zoom using Pointer Events.
const activePointers = new Map();
stage.addEventListener('pointerdown', e => {
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (activePointers.size === 2) {
    const a=[...activePointers.values()];
    pinchStart = Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
});
stage.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (activePointers.size === 2) {
    const a=[...activePointers.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if (pinchStart) setZoom(zoom * d/pinchStart);
    pinchStart=d;
  }
});
function clearPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchStart=null;
}

stage.addEventListener('pointerup', clearPointer);
stage.addEventListener('pointercancel', clearPointer);

// Keyboard controls.
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goNext();
  if (e.key === 'ArrowRight') goPrev();
  if (e.key === '+' || e.key === '=') setZoom(zoom + .25);
  if (e.key === '-') setZoom(zoom - .25);
  if (e.key === '0') resetFit();
});

// Double click/tap toggles a comfortable reading zoom.
let lastTap = 0;
stage.addEventListener('dblclick', e => {
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left-rect.width/2, y=e.clientY-rect.top-rect.height/2;
  setZoom(zoom > 1 ? 1 : 1.8, x, y);
});

async function loadFlipbook() {
  try {
    const response = await fetch('data.json');
    if (!response.ok) throw new Error(`Unable to load data.json (${response.status})`);

    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0 || data.some(src => typeof src !== 'string')) {
      throw new Error('data.json must contain a non-empty array of image URLs');
    }

    images = data;
    buildPages();
    await Promise.all([...book.querySelectorAll('img')].map(img => new Promise(resolve => {
      if (img.complete) resolve(); else { img.onload=resolve; img.onerror=resolve; }
    })));

    loading.style.display='none';
    resetFit();
    render();
  } catch (error) {
    loading.textContent = `Unable to prepare flipbook: ${error.message}`;
  }
}

loadFlipbook();
</script>
</body>
</html>
