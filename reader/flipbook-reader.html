<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>Daily Grace — Flipbook (Viewport Fit)</title>
<style>
:root {
  --navy:#071d35;
  --gold:#d9a84f;
  --cream:#f7f0df;
  --shadow:rgba(0,0,0,.38);
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f7eddb; }
body {
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  touch-action:none;
}
.app {
  width:100%; height:100%; display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.65), transparent 28%),
    linear-gradient(135deg, #f7eddb, #eee0c7);
}
.topbar {
  height:58px; flex:0 0 58px; display:flex; align-items:center;
  justify-content:space-between; padding:0 14px;
  border-bottom:1px solid rgba(217,168,79,.35);
  background:rgba(4,17,31,.88); backdrop-filter:blur(10px);
  z-index:20;
}
.brand { font-weight:700; letter-spacing:.04em; }
.brand span { color:var(--gold); }
.tools { display:flex; gap:7px; align-items:center; }
button {
  appearance:none; border:1px solid rgba(217,168,79,.55);
  background:#102b46; color:#fff; border-radius:9px;
  min-width:38px; height:36px; padding:0 11px;
  font-size:15px; font-weight:650; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
button:hover { background:#173956; }
button:disabled { opacity:.38; cursor:default; }
#home {
  min-width:48px;
  height:42px;
  padding:0;
  border-color:transparent;
  background:transparent;
  color:var(--gold);
  font-size:30px;
  font-weight:900;
  line-height:1;
  box-shadow:none;
}
#home:hover { background:transparent; color:#f0c66c; }
.stage {
  flex:1; min-height:0; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  perspective:2200px; perspective-origin:50% 50%;
  cursor:grab;
}
.stage.dragging { cursor:grabbing; }
.book-shadow {
  position:absolute; width:min(92vw,560px); height:min(78vh,1000px);
  border-radius:12px; background:rgba(0,0,0,.32); filter:blur(24px);
  transform:translateY(20px) scale(.96); pointer-events:none;
}
.book {
  position:relative;
  /* Fit the entire page inside the available viewport area. */
  width:auto;
  height:min(calc(100vh - 123px), 92vh);
  aspect-ratio:9 / 16;
  max-width:calc(100vw - 24px);
  max-height:calc(100vh - 123px);
  transform-style:preserve-3d;
  transition:transform .18s ease;
  will-change:transform;
}
.desktop-spread { display:none; }
.page {
  position:absolute; inset:0; transform-style:preserve-3d;
  transform-origin:left center;
  border-radius:5px 9px 9px 5px;
  overflow:hidden;
  box-shadow:8px 10px 25px var(--shadow);
  background:#eee;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.page img {
  width:100%; height:100%; object-fit:contain; display:block;
  background:#eee;
  user-select:none; -webkit-user-drag:none;
}
.page.back {
  transform:rotateY(180deg);
}
.flip {
  transition:transform .72s cubic-bezier(.22,.7,.18,1);
}
.flipped {
  transform:rotateY(-180deg);
}
/* Pages are layered from right to left. */
.page:nth-child(1) { z-index:4; }
.page:nth-child(2) { z-index:3; }
.page:nth-child(3) { z-index:2; }
.page:nth-child(4) { z-index:1; }

.hint {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.58); font-size:12px; pointer-events:none;
  white-space:nowrap;
}
.loading {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:#f7eddb; color:var(--navy); z-index:50; font-size:16px;
}
@media (max-width:600px) {
  .topbar { height:52px; flex-basis:52px; padding:0 9px; }
  .brand { font-size:14px; }
  button { min-width:35px; height:34px; padding:0 8px; }
  .stage { padding:3px; }
  .book {
    width:auto;
    height:min(calc(100vh - 52px), 92vh);
    aspect-ratio:9 / 16;
    max-width:calc(100vw - 8px);
    max-height:calc(100vh - 52px);
  }
  .hint { display:none; }
}
@media (min-width:601px) {
  .book { display:none; }
  .desktop-spread {
    display:flex;
    width:min(calc(100vw - 80px), 1120px);
    height:min(calc(100vh - 58px), 92vh);
    justify-content:center;
    gap:16px;
    padding:0 48px;
    overflow:hidden;
    border-radius:5px 9px 9px 5px;
    box-shadow:8px 10px 25px var(--shadow);
    background:#eee;
  }
  .desktop-spread .spread-page {
    position:relative;
    flex:1 1 0; min-width:0; width:0; height:100%;
  }
  .desktop-spread .spread-page img {
    width:100%; height:100%; object-fit:contain;
    background:#eee; user-select:none; -webkit-user-drag:none;
  }
  .desktop-spread .spread-page:first-child { cursor:w-resize; }
  .desktop-spread .spread-page:last-child { cursor:e-resize; }
}
.audio-play {
  position:absolute;
  top:0;
  left:0;
  z-index:6;
  width:44px;
  height:44px;
  min-width:44px;
  padding:0;
  border-radius:50%;
  border:2px solid rgba(217,168,79,.95);
  background:rgba(7,29,53,.82);
  color:#f7f0df;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  cursor:pointer;
  line-height:1;
  touch-action:manipulation;
  opacity:0;
  pointer-events:none;
}
.audio-play.is-placed {
  opacity:1;
  pointer-events:auto;
}
.audio-play svg {
  display:block;
  width:18px;
  height:18px;
}
.audio-play:hover,
.audio-play:focus-visible {
  background:rgba(16,43,70,.96);
  color:#fff;
}
.audio-play.is-playing {
  background:var(--gold);
  color:var(--navy);
  border-color:#f0c66c;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Daily <span>Grace</span> · Flipbook</div>
    <div class="tools">
      <button id="home" aria-label="Home" title="Home">&#8962;</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="loading" id="loading">Preparing your Daily Grace flipbook…</div>
    <div class="book-shadow"></div>
    <div class="book" id="book" aria-label="Daily Grace flipbook"></div>
    <div class="desktop-spread" id="desktopSpread" aria-label="Daily Grace flipbook spread"></div>
  </main>

</div>

<script>
let images = [];
const book = document.getElementById('book');
const stage = document.getElementById('stage');
const loading = document.getElementById('loading');
const desktopSpread = document.getElementById('desktopSpread');

let current = 0;       // number of pages turned
let zoom = 1;
let panX = 0, panY = 0;
let pointerStart = null;
let pinchStart = null;
let animating = false;
let suppressDesktopClick = false;
const pageAudio = new Audio();

function imageFileName(src) {
  try {
    return decodeURIComponent(new URL(src, window.location.href).pathname.split('/').pop() || '');
  } catch {
    return decodeURIComponent((src.split('/').pop() || '').split('?')[0]);
  }
}

function isComicImage(src) {
  return / - Comic\.[^.]+$/i.test(imageFileName(src));
}

function audioUrlForImage(src) {
  const fileName = imageFileName(src);
  const baseName = fileName.replace(/\.[^.]+$/, '');
  const month = (baseName.match(/^([A-Za-z]+)\b/) || [])[1]
    || new Date().toLocaleString('en-US', { month: 'long' });
  return new URL(`audio/${month}/mp3/${baseName}.mp3`, window.location.href).href;
}

const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

function sameAudioUrl(a, b) {
  if (!a || !b) return false;
  try { return decodeURI(a) === decodeURI(b); }
  catch { return a === b; }
}

function playPageAudio(src) {
  if (isComicImage(src)) return false;
  const url = audioUrlForImage(src);
  if (sameAudioUrl(pageAudio.src, url) && !pageAudio.paused) {
    stopPageAudio();
    return true;
  }
  pageAudio.src = url;
  pageAudio.play().catch(() => {});
  return true;
}

function stopPageAudio() {
  pageAudio.pause();
  pageAudio.currentTime = 0;
  syncPlayButtons();
}

function syncPlayButtons() {
  const playingUrl = !pageAudio.paused && pageAudio.src ? pageAudio.src : '';
  document.querySelectorAll('.audio-play').forEach(btn => {
    const on = playingUrl && sameAudioUrl(playingUrl, audioUrlForImage(btn.dataset.src));
    btn.classList.toggle('is-playing', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? 'Pause narration' : 'Play narration');
    btn.innerHTML = on ? pauseIcon : playIcon;
  });
}

function createPlayButton(src) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'audio-play';
  btn.dataset.src = src;
  btn.setAttribute('aria-label', 'Play narration');
  btn.innerHTML = playIcon;
  const stopStageGesture = e => e.stopPropagation();
  btn.addEventListener('pointerdown', stopStageGesture);
  btn.addEventListener('pointerup', stopStageGesture);
  btn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    playPageAudio(src);
  });
  return btn;
}

function containedImageBox(img) {
  const frameW = img.clientWidth;
  const frameH = img.clientHeight;
  const natW = img.naturalWidth;
  const natH = img.naturalHeight;
  if (!natW || !natH || !frameW || !frameH) {
    return { left: 0, top: 0, width: frameW, height: frameH };
  }
  const scale = Math.min(frameW / natW, frameH / natH);
  const width = natW * scale;
  const height = natH * scale;
  return {
    left: (frameW - width) / 2,
    top: (frameH - height) / 2,
    width,
    height
  };
}

function positionPlayButton(btn) {
  const img = btn.parentElement && btn.parentElement.querySelector('img');
  if (!img || !img.naturalWidth) return;
  const box = containedImageBox(img);
  const size = btn.offsetWidth || 44;
  const inset = 12;
  btn.style.top = `${box.top + inset}px`;
  btn.style.left = `${box.left + box.width - inset - size}px`;
  btn.classList.add('is-placed');
}

function positionPlayButtons() {
  document.querySelectorAll('.audio-play').forEach(positionPlayButton);
}

function handlePageTap(x, y) {
  if (!window.matchMedia('(min-width: 601px)').matches) return;
  const el = document.elementFromPoint(x, y);
  if (!el || el.closest('.audio-play')) return;
  const page = el.closest('.spread-page');
  if (!page) return;
  if (page === desktopSpread.firstElementChild) goPrev();
  else if (page === desktopSpread.lastElementChild) goNext();
}


function fitBookToViewport() {
  const stageRect = stage.getBoundingClientRect();
  const availableW = Math.max(1, stageRect.width - 16);
  const availableH = Math.max(1, stageRect.height - 16);

  // Daily Grace artwork is portrait. Use the actual first image ratio when loaded.
  const firstImg = book.querySelector('img');
  const ratio = firstImg && firstImg.naturalWidth && firstImg.naturalHeight
    ? firstImg.naturalWidth / firstImg.naturalHeight
    : 9 / 16;

  let h = availableH;
  let w = h * ratio;

  if (w > availableW) {
    w = availableW;
    h = w / ratio;
  }

  book.style.width = `${Math.floor(w)}px`;
  book.style.height = `${Math.floor(h)}px`;

  // Keep zoom/pan independent of the fit calculation.
  if (zoom === 1) {
    panX = 0;
    panY = 0;
    updateZoom();
  }
  requestAnimationFrame(positionPlayButtons);
}

function buildPages() {
  images.forEach((src, i) => {
    const page = document.createElement('div');
    page.className = 'page flip';
    page.dataset.index = i;
    page.style.zIndex = String(images.length - i);

    const img = document.createElement('img');
    img.src = src;
    img.alt = `Daily Grace page ${i + 1}`;
    img.draggable = false;
    page.appendChild(img);
    if (!isComicImage(src)) page.appendChild(createPlayButton(src));
    img.addEventListener('load', positionPlayButtons);
    book.appendChild(page);
  });
}

function render() {
  [...book.children].forEach((page, i) => {
    page.classList.toggle('flipped', i < current);
    // Turned pages sit above unturned pages.
    page.style.zIndex = i < current ? (20 + i) : (images.length - i);
  });
  renderDesktopSpread();
  updateZoom();
}

function renderDesktopSpread() {
  desktopSpread.replaceChildren();
  [images[current], images[current + 1]].filter(Boolean).forEach((src, offset) => {
    const wrap = document.createElement('div');
    wrap.className = 'spread-page';
    const img = document.createElement('img');
    img.src = src;
    img.alt = `Daily Grace page ${current + offset + 1}`;
    img.draggable = false;
    wrap.appendChild(img);
    if (!isComicImage(src)) wrap.appendChild(createPlayButton(src));
    img.addEventListener('load', positionPlayButtons);
    desktopSpread.appendChild(wrap);
  });
  syncPlayButtons();
  requestAnimationFrame(positionPlayButtons);
}

function goNext() {
  if (animating || current >= images.length - 1) return;
  stopPageAudio();
  animating = true;
  current++;
  render();
  setTimeout(() => animating = false, 740);
}
function goPrev() {
  if (animating || current <= 0) return;
  stopPageAudio();
  animating = true;
  current--;
  render();
  setTimeout(() => animating = false, 740);
}

function updateZoom() {
  book.style.transformOrigin = 'center center';
  book.style.transform = `translate3d(${panX}px,${panY}px,0) scale(${zoom})`;
}

function clampPan() {
  const stageRect = stage.getBoundingClientRect();
  const bookRect = book.getBoundingClientRect();
  const maxX = Math.max(0, (bookRect.width - stageRect.width) / 2);
  const maxY = Math.max(0, (bookRect.height - stageRect.height) / 2);
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

function setZoom(z, centerX=null, centerY=null) {
  const old = zoom;
  zoom = Math.max(1, Math.min(3.5, z));
  if (centerX !== null && centerY !== null && zoom !== old) {
    // Keep the point under the user's fingers/mouse roughly stationary.
    const r = zoom / old;
    panX = centerX - (centerX - panX) * r;
    panY = centerY - (centerY - panY) * r;
  }
  if (zoom === 1) { panX = 0; panY = 0; }
  updateZoom();
  clampPan();
  updateZoom();
}

function resetFit() {
  zoom = 1;
  panX = 0;
  panY = 0;
  fitBookToViewport();
  updateZoom();
}

document.getElementById('home').onclick = () => { window.location.href = '../index.html'; };
desktopSpread.addEventListener('click', e => {
  if (!window.matchMedia('(min-width: 601px)').matches) return;
  if (suppressDesktopClick) {
    suppressDesktopClick = false;
    return;
  }
  if (e.target.closest('.audio-play')) return;
  const page = e.target.closest('.spread-page');
  if (!page) return;
  if (page === desktopSpread.firstElementChild) goPrev();
  if (page === desktopSpread.lastElementChild) goNext();
});
pageAudio.addEventListener('play', syncPlayButtons);
pageAudio.addEventListener('pause', syncPlayButtons);
pageAudio.addEventListener('ended', stopPageAudio);

// Mouse wheel zoom (trackpads and desktop mice).
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width/2;
  const y = e.clientY - rect.top - rect.height/2;
  setZoom(zoom * Math.exp(-e.deltaY * .001), x, y);
}, {passive:false});

// Pointer gestures: swipe to turn pages; drag when zoomed.
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pointerStart = {x:e.clientX, y:e.clientY, lastX:e.clientX, lastY:e.clientY, t:performance.now()};
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!pointerStart) return;
  if (zoom > 1 && activePointers.size < 2) {
    panX += e.clientX - pointerStart.lastX;
    panY += e.clientY - pointerStart.lastY;
    pointerStart.lastX = e.clientX;
    pointerStart.lastY = e.clientY;
    clampPan();
    updateZoom();
  }
});
stage.addEventListener('pointerup', e => {
  stage.classList.remove('dragging');
  if (!pointerStart) return;
  const dx = e.clientX - pointerStart.x;
  const dy = e.clientY - pointerStart.y;
  const dt = performance.now() - pointerStart.t;
  pointerStart = null;
  suppressDesktopClick = true;

  const isSwipe = Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25 && dt < 700;
  if (isSwipe) {
    if (dx < 0) goNext(); else goPrev();
    return;
  }
  if (zoom > 1) return;
  handlePageTap(e.clientX, e.clientY);
});
stage.addEventListener('pointercancel', e => {
  stage.classList.remove('dragging');
  pointerStart = null;
});

// Native pinch-to-zoom using Pointer Events.
const activePointers = new Map();
stage.addEventListener('pointerdown', e => {
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (activePointers.size === 2) {
    const a=[...activePointers.values()];
    pinchStart = Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
});
stage.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (activePointers.size === 2) {
    const a=[...activePointers.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if (pinchStart) setZoom(zoom * d/pinchStart);
    pinchStart=d;
  }
});
function clearPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchStart=null;
}

stage.addEventListener('pointerup', clearPointer);
stage.addEventListener('pointercancel', clearPointer);

// Keyboard controls.
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goNext();
  if (e.key === 'ArrowRight') goPrev();
  if (e.key === '+' || e.key === '=') setZoom(zoom + .25);
  if (e.key === '-') setZoom(zoom - .25);
  if (e.key === '0') resetFit();
});

// Double click/tap toggles a comfortable reading zoom.
let lastTap = 0;
stage.addEventListener('dblclick', e => {
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left-rect.width/2, y=e.clientY-rect.top-rect.height/2;
  setZoom(zoom > 1 ? 1 : 1.8, x, y);
});

async function loadFlipbook() {
  const dataSource = window.location.search.slice(1) || 'data.json';
  const dataPath = `images/${dataSource}`;

  try {
    const response = await fetch(dataPath);
    if (!response.ok) throw new Error(`Unable to load ${dataPath} (${response.status})`);

    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0 || data.some(src => typeof src !== 'string')) {
      throw new Error(`${dataPath} must contain a non-empty array of image URLs`);
    }

    images = data.map(src => new URL(src, response.url).href);
    buildPages();
    await Promise.all([...book.querySelectorAll('img')].map(img => new Promise(resolve => {
      if (img.complete) resolve(); else { img.onload=resolve; img.onerror=resolve; }
    })));

    loading.style.display='none';
    resetFit();
    render();
    requestAnimationFrame(positionPlayButtons);
    window.addEventListener('resize', positionPlayButtons);
  } catch (error) {
    loading.textContent = `Unable to prepare flipbook: ${error.message}`;
  }
}

loadFlipbook();
</script>
</body>
</html>
