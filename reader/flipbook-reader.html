<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>Daily Grace — Flipbook (Viewport Fit)</title>
<link rel="stylesheet" href="../assets/styles/flipbook-reader.css?v=20260905-2">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Daily <span>Grace</span> · Flipbook</div>
    <div class="tools">
      <button id="previous" aria-label="Previous page" title="Previous page">&#8249;</button>
      <button id="next" aria-label="Next page" title="Next page">&#8250;</button>
      <button id="zoomOut" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="fit" title="Fit page to screen">Fit</button>
      <button id="home" aria-label="Home" title="Home">&#8962;</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="loading" id="loading">Preparing your Daily Grace flipbook…</div>
    <div class="book-shadow"></div>
    <div class="book" id="book" aria-label="Daily Grace flipbook"></div>
    <div class="desktop-spread" id="desktopSpread" aria-label="Daily Grace flipbook spread"></div>
  </main>

</div>

<script src="../assets/scripts/flipbook-reader.js?v=20260905-2"></script>
</body>
</html>
